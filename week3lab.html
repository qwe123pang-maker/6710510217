<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#0077cc;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#005fa3;
            padding:12px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
        }

        main{
            max-width:700px;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        h2{
            margin-bottom:20px;
            text-align:center;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,select,textarea{
            width:100%;
            padding:10px;
            border:1px solid #bbb;
            border-radius:5px;
        }

        fieldset{
            margin-top:20px;
            padding:15px;
        }

        .radio-group{
            display:flex;
            gap:20px;
            margin-top:10px;
        }

        .radio-group label{
            font-weight:normal;
        }

        button{
            margin-top:20px;
            padding:12px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            color:white;
        }

        .submit{
            background:#28a745;
        }

        .reset{
            background:#dc3545;
        }

        footer{
            text-align:center;
            background:#222;
            color:white;
            padding:15px;
            margin-top:30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Registration</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Register</a>
    <a href="#">Contact</a>
</nav>

<main>

<h2>Registration Form</h2>

<form action="#" method="post">

<label for="fullname">Full Name</label>
<input
type="text"
id="fullname"
name="fullname"
required
minlength="3">

<label for="email">Email</label>
<input
type="email"
id="email"
name="email"
required>

<label for="password">Password</label>
<input
type="password"
id="password"
name="password"
required
minlength="8">

<label for="phone">Phone Number</label>
<input
type="tel"
id="phone"
name="phone"
pattern="0[0-9]{9}"
title="Enter 10 digits starting with 0"
required>

<label for="age">Age</label>
<input
type="number"
id="age"
name="age"
min="18"
max="60"
required>

<label for="birthday">Birthday</label>
<input
type="date"
id="birthday"
name="birthday">

<label for="faculty">Faculty</label>
<select id="faculty" name="faculty">
    <option>Management Sciences</option>
    <option>Engineering</option>
    <option>Science</option>
    <option>Education</option>
</select>

<fieldset>

<legend>Gender</legend>

<div class="radio-group">

<label>
<input type="radio" name="gender" value="Male" required>
Male
</label>

<label>
<input type="radio" name="gender" value="Female">
Female
</label>

<label>
<input type="radio" name="gender" value="Other">
Other
</label>

</div>

</fieldset>

<label for="address">Address</label>
<textarea id="address" rows="4"></textarea>

<button class="submit" type="submit">Register</button>
<button class="reset" type="reset">Reset</button>

</form>

</main>

<footer>
    <p>Â© 2026 Prince of Songkla University</p>
</footer>

</body>
</html>
<!--
การใช้ AI ในการช่วยตรวจงาน

งานนี้ผมใช้ ChatGPT ช่วยตรวจสอบหน้า Registration Page ว่ามีส่วนไหนที่ควรปรับปรุงบ้าง โดย AI แนะนำให้เพิ่ม <label> ให้ครบทุกช่อง จัดกลุ่มตัวเลือกด้วย <fieldset> และ <legend> และเพิ่มการตรวจสอบข้อมูลด้วย required, pattern, min, max และ minlength

หลังจากนั้นผมได้นำคำแนะนำมาปรับแก้โค้ดด้วยตัวเอง เพื่อให้หน้าเว็บใช้งานได้ง่ายขึ้น มีโครงสร้างแบบ Semantic และตรงตามเงื่อนไขของงานที่ได้รับมอบหมาย
-->
